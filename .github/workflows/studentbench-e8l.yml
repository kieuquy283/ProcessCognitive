name: StudentBench E8L lexical proxy development ablation
on:
  pull_request:
    paths:
      - 'experiments/behavioral_context/lexical_proxy_ablation.py'
      - 'experiments/behavioral_context/tests/test_lexical_proxy_ablation.py'
      - '.github/workflows/studentbench-e8l.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lexical-ml-development:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r experiments/behavioral_context/requirements-pilot.txt
      - name: Software tests with synthetic data only
        run: python -m pytest -q experiments/behavioral_context/tests/test_lexical_proxy_ablation.py
      - name: Download pinned GRE Quant source
        run: python experiments/behavioral_context/download_e8r_subset.py --out ./data --max-workers 12
      - name: Fit three matched development models
        run: |
          python experiments/behavioral_context/lexical_proxy_ablation.py --data ./data --per-tutor 62 --out ./results/E8L_DEVELOPMENT_AGGREGATE.json
      - name: Upload aggregate-only learning-outcome diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E8L-lexical-development-aggregate
          path: results/E8L_DEVELOPMENT_AGGREGATE.json
          if-no-files-found: ignore
          retention-days: 7
